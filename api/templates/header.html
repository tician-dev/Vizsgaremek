{% load static %}

<nav
  class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0"
>
  <a
    href="{% url 'home' %}"
    class="navbar-brand d-flex align-items-center px-4 px-lg-5"
  >
    <h2 class="m-0 text-primary"><i class="fa fa-book me-3"></i>Vizsgaremek</h2>
  </a>
  <button
    type="button"
    class="navbar-toggler me-4"
    data-bs-toggle="collapse"
    data-bs-target="#navbarCollapse"
  >
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarCollapse">
    <div class="navbar-nav ms-auto p-4 p-lg-0">
      <a href="{% url 'home' %}" class="nav-item nav-link active">Kezdőlap</a>
      <a href="/" class="nav-item nav-link active">Kapocslat</a>
    </div>

    {% if user.is_authenticated %}
    <div class="nav-item dropdown">
        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"
          >Oldalak</a
        >
        <div class="dropdown-menu fade-down m-0">
          <a href="{% url 'evaluation' %}" class="dropdown-item">Tesztkitöltés</a>
        </div>
      </div>
    <div class="nav-item dropdown d-lg-flex d-none align-items-center">
      <a
        href="#"
        class="btn btn-primary py-4 px-lg-5 dropdown-toggle"
        data-bs-toggle="dropdown"
        role="button"
      >
        <i class="fa fa-user me-2"></i>{{ user.username }}
      </a>
      <div class="dropdown-menu dropdown-menu-end fade-down m-0">
        <a href="{% url 'profile' %}" class="dropdown-item">
          <i class="fa fa-user-circle me-2"></i>Profil
        </a>
        <a href="{% url 'logout' %}" class="dropdown-item">
          <i class="fa fa-sign-out-alt me-2"></i>Kijelentkezés
        </a>
      </div>
    </div>
    <!-- Mobile menu -->
    <div class="nav-item d-lg-none">
      <a href="{% url 'profile' %}" class="nav-link">👤 {{ user.username }}</a>
      <a href="{% url 'logout' %}" class="nav-link">Kijelentkezés</a>
    </div>
    {% else %}
    <a
      href="{% url 'register' %}"
      class="btn btn-primary py-4 px-lg-5 d-none d-lg-block"
    >
      Regisztráció<i class="fa fa-arrow-right ms-3"></i>
    </a>
    <!-- Mobile menu -->
    <div class="nav-item d-lg-none">
      <a href="{% url 'login' %}" class="nav-link">Bejelentkezés</a>
      <a href="{% url 'register' %}" class="nav-link">Regisztráció</a>
    </div>
    {% endif %}
  </div>
</nav>
